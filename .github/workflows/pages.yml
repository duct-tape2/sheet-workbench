name: Deploy local file workbench to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:static-demo
      - run: npm run test:e2e:local
      - run: npm run build:local -- --base "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
